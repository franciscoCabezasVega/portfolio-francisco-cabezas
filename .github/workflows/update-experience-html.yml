name: Update Experience

on:
  schedule:
    - cron: "0 6 14 1 *"  # 14 de enero a las 6am
  workflow_dispatch:       # Ejecutar manualmente

jobs:
  update-experience:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Calculate experience years
        id: calc
        run: |
          CURRENT_YEAR=$(date +'%Y')
          START_YEAR=2020
          YEARS=$((CURRENT_YEAR - START_YEAR))
          echo "YEARS_EXPERIENCE=$YEARS" >> $GITHUB_ENV

      - name: Replace placeholder in all files
        run: |
          find . -type f \( -name "*.html" -o -name "*.md" -o -name "*.json" \) -print0 | \
          xargs -0 sed -i "s/{{YEARS_EXPERIENCE}}/${YEARS_EXPERIENCE}/g"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Update experience years to ${YEARS_EXPERIENCE}"
            git push
          else
            echo "No changes to commit."
          fi
